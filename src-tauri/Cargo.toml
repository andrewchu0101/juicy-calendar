[package]
name = "juicy-calendar"
version = "0.1.0"
description = "A local-first visual time blocking app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "juicy_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
